name = "Rootform"
grammar = "hcl"
path_suffixes = ["rf.hcl"]
line_comments = ["# ", "// "]
block_comment = ["/*", "*/"]
autoclose_before = ",}])"
tab_size = 2
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "/*", end = "*/", close = true, newline = false, not_in = ["comment", "string"] },
]
